<!DOCTYPE html>
<html>
<head>
  <base target="_self">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--green:#14b887;--green2:#e0f7ef;--ink:#151a19;--muted:#7b8583;--line:#e6e9e8;--bg:#f7f8f8;--white:#fff;--red:#c53b45;--shadow:0 8px 26px rgba(20,35,30,.06)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer;border:0}
    .top{background:#07110e;color:white;padding:18px max(18px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}
    .brand{font-weight:800;font-size:19px;letter-spacing:.2px}.brand span{color:#5be0b4}.top small{color:#aab8b3}
    .wrap{max-width:1080px;margin:auto;padding:22px 18px 92px}.hero{background:linear-gradient(120deg,#e4fbf1,#f8fffb);border:1px solid #d9f3e8;border-radius:22px;padding:22px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .hero h1{margin:0 0 7px;font-size:26px}.hero p{margin:0;color:#65736d}.hero-mark{font-size:42px}
    .row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapline{flex-wrap:wrap}
    .btn{padding:11px 16px;border-radius:999px;background:#111;color:white;font-weight:650}.btn.green{background:var(--green);color:#06251c}.btn.light{background:#f0f2f1;color:#202725}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:8px 12px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
    .tabs{display:flex;gap:8px;margin:15px 0 20px;overflow:auto}.tab{background:#edf0ef;color:#5f6966;padding:10px 16px;border-radius:999px;white-space:nowrap}.tab.active{background:#101715;color:white}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:var(--shadow)}.account{padding:0;overflow:hidden}.account-head{padding:17px 18px;border-bottom:1px solid var(--line)}.account-body{padding:17px 18px}.pill{display:inline-block;border-radius:999px;padding:5px 12px;background:var(--green2);color:#24735a;font-size:12px;font-weight:700}.pill.blue{background:#e4f4fa;color:#34758a}.pill.gray{background:#f0f1f1;color:#626b68}.pill.red{background:#fff0f0;color:#a83b42}
    .account-id{font-size:23px;font-weight:750;margin:9px 0 2px;letter-spacing:.2px}.muted{color:var(--muted)}.balance{font-size:22px;font-weight:750}.account-actions{display:flex;gap:8px;margin-top:16px}.account-actions .btn{flex:1}.section-title{font-size:21px;margin:0 0 14px}.empty{padding:28px;text-align:center;color:var(--muted);background:white;border:1px dashed #d5dcda;border-radius:17px}
    .formbox{max-width:480px;margin:7vh auto;background:white;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.formbox h1{margin:0 0 6px}.field{margin:13px 0}.field label{display:block;font-size:13px;color:#59635f;font-weight:650;margin-bottom:6px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dce2df;border-radius:12px;background:white;outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.hint{font-size:12px;color:var(--muted);line-height:1.5}.link{color:#159b73;font-weight:700;cursor:pointer}.notice{padding:12px 14px;border-radius:12px;background:#eefaf5;color:#246c54;font-size:13px;margin:12px 0}.notice.warn{background:#fff8e8;color:#8a641b}.notice.error{background:#fff0f0;color:#a83b42}
    .tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#7a8581;font-weight:650}
    .bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{background:none;color:#8b9491;min-width:90px;padding:5px 12px;font-size:11px}.bottom button b{display:block;font-size:20px;margin-bottom:2px}.bottom button.active{color:#168b68}
    .hidden{display:none!important}.modalback{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:white;border-radius:20px;padding:22px;width:min(100%,520px);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:20;background:#101715;color:white;padding:12px 18px;border-radius:999px;box-shadow:var(--shadow);max-width:90%;font-size:13px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:15px 13px 95px}.hero{padding:18px}.hero h1{font-size:22px}.top{padding:16px}.formbox{margin:4vh 13px;padding:21px}.account-id{font-size:21px}}
  </style>
</head>
<body>
  <div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const $ = s => document.querySelector(s);
let token = sessionStorage.getItem('vvb_token') || '';
let currentUser = null, appData = null, activeTab = 'home';
const money = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(name,...args){
  const response = await fetch('/api/gas', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, args})
  });
  let result;
  try { result = await response.json(); }
  catch (_) { throw new Error('Respons server tidak valid. Periksa URL Apps Script dan deployment.'); }
  if (!response.ok || result.error) throw new Error(result.error || 'Permintaan gagal.');
  return result;
}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200)}
function showError(e){toast(e.message||String(e))}
function field(label,name,type='text',placeholder='',required=true){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></div>`}
function renderAuth(mode='login'){
  $('#app').innerHTML=`<div class="formbox"><div class="brand" style="color:#111">VERSA <span>VIRTUAL BROKER</span></div><h1 style="margin-top:23px">${mode==='login'?'Selamat datang kembali':'Buat akun member'}</h1><p class="muted">${mode==='login'?'Masuk untuk mengelola akun trading Anda.':'Daftar untuk mengakses dashboard Versa.'}</p>
  <form id="authForm">${mode==='register'?field('Nama lengkap','name','text','Nama Anda')+field('Nomor WhatsApp','phone','tel','08xxxxxxxxxx',false):''}
  ${field('Email','email','email','nama@email.com')}${field('Password aplikasi','password','password','Minimal 8 karakter')}
  <button class="btn green" style="width:100%;margin-top:8px">${mode==='login'?'Masuk':'Daftar'}</button></form>
  <p class="hint" style="margin-top:18px">${mode==='login'?'Belum punya akun?':'Sudah punya akun?'} <span class="link" id="switchAuth">${mode==='login'?'Daftar sekarang':'Masuk'}</span></p>
  <p class="hint">Owner masuk menggunakan email dan password owner yang diatur di Script Properties.</p></div>`;
  $('#switchAuth').onclick=()=>renderAuth(mode==='login'?'register':'login');
  $('#authForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{if(mode==='register'){const r=await call('register',f);toast(r.message);renderAuth('login')}else{const r=await call('login',f);token=r.token;sessionStorage.setItem('vvb_token',token);currentUser=r.user;await loadData()}}catch(err){showError(err)}};
}
async function loadData(){try{appData=await call('getAppData',token);currentUser=appData.user;renderApp()}catch(e){token='';sessionStorage.removeItem('vvb_token');renderAuth();showError(e)}}
function renderApp(){
  const owner=appData.owner;
  $('#app').innerHTML=`<header class="top"><div><div class="brand">VERSA <span>VIRTUAL BROKER</span></div><small>${owner?'Owner Console':'Member Dashboard'}</small></div><button class="btn light small" id="logout">Keluar</button></header>
  <main class="wrap"><section class="hero"><div><h1>${owner?'Panel Owner':'Halo, '+esc(currentUser.name)+'!'}</h1><p>${owner?'Kelola permintaan akun, deposit, dan member.':'Kelola akun trading dan pantau permintaan Anda.'}</p></div><div class="hero-mark">↗</div></section>
  <nav class="tabs" id="tabs">${(owner?[['home','Ringkasan'],['requests','Permintaan akun'],['deposits','Deposit'],['withdrawals','Withdraw'],['members','Member'],['ownerAccounts','Akun']]:[['home','Accounts'],['requests','Permintaan'],['deposits','Deposit'],['withdrawals','Withdraw']]).map(([id,label])=>`<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav>
  <div id="content"></div></main>
  <nav class="bottom"><button class="${activeTab==='home'?'active':''}" data-tab="home"><b>⌂</b>Home</button><button class="${activeTab==='deposits'?'active':''}" data-tab="deposits"><b>▤</b>Funds</button><button class="${activeTab==='requests'?'active':''}" data-tab="requests"><b>◉</b>Accounts</button><button data-tab="members"><b>☷</b>${owner?'Members':'Profile'}</button></nav>`;
  $('#logout').onclick=async()=>{await call('logout',token);token='';sessionStorage.removeItem('vvb_token');renderAuth()};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderApp()});
  renderContent();
}
function renderContent(){
 const c=$('#content'), owner=appData.owner;
 if(activeTab==='home'){
  if(owner){c.innerHTML=`<h2 class="section-title">Ringkasan owner</h2><div class="grid"><div class="card"><div class="muted">Permintaan akun menunggu</div><div class="balance">${appData.requests.filter(x=>x.status==='pending').length}</div></div><div class="card"><div class="muted">Deposit menunggu</div><div class="balance">${appData.deposits.filter(x=>x.status==='pending').length}</div></div><div class="card"><div class="muted">Total member</div><div class="balance">${appData.members.length}</div></div><div class="card"><div class="muted">Akun trading</div><div class="balance">${appData.accounts.length}</div></div></div>`;return}
  c.innerHTML=`<div class="row between wrapline"><h2 class="section-title">Accounts <span class="pill gray">Simulasi</span></h2><button class="btn" id="newAccount">＋ Add</button></div>${appData.accounts.length?`<div class="grid">${appData.accounts.map(accountCard).join('')}</div>`:`<div class="empty">Belum ada akun trading.<br><button class="btn green" id="newAccount2" style="margin-top:14px">＋ Buka akun trading</button></div>`}`;
  const open=()=>openAccountModal();if($('#newAccount'))$('#newAccount').onclick=open;if($('#newAccount2'))$('#newAccount2').onclick=open;
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showCredentials(b.dataset.view));
  document.querySelectorAll('[data-deposit]').forEach(b=>b.onclick=()=>openDepositModal(b.dataset.deposit));
  document.querySelectorAll('[data-withdraw]').forEach(b=>b.onclick=()=>openWithdrawalModal(b.dataset.withdraw));
 }else if(activeTab==='requests'){c.innerHTML=owner?ownerRequests():memberRequests()}
 else if(activeTab==='deposits'){c.innerHTML=owner?ownerDeposits():memberDeposits()}
 else if(activeTab==='withdrawals'){c.innerHTML=owner?ownerWithdrawals():memberWithdrawals()}
 else if(activeTab==='members'){c.innerHTML=owner?ownerMembers():'<div class="card"><h3>Profil member</h3><p>'+esc(currentUser.name)+'</p><p class="muted">'+esc(currentUser.email)+'</p></div>'}
 else if(activeTab==='ownerAccounts' && owner){c.innerHTML=ownerAccounts()}
 bindOwnerActions();
}
function accountCard(a){return `<article class="card account"><div class="account-head"><div class="row between"><span class="pill ${a.accountType==='Cent'?'blue':''}">${esc(a.accountType)}</span><span class="muted">MT5</span></div><div class="account-id">${esc(a.loginId)}</div><span class="muted">${esc(a.displayName)}</span></div><div class="account-body"><div class="row between"><span class="muted">Balance:</span><span class="balance">${a.currency==='USC'?Number(a.balance).toLocaleString('id-ID')+' USC':money(a.balance)}</span></div><div class="row between" style="margin-top:5px"><span class="muted">Server: ${esc(a.server)}</span><span class="pill">${esc(a.status)}</span></div><div class="account-actions"><button class="btn light" data-deposit="${esc(a.accountId)}">▤ Deposit</button><button class="btn light" data-withdraw="${esc(a.accountId)}">↗ Withdraw</button><button class="btn light" data-view="${esc(a.accountId)}">⌁ Lihat login</button></div></div></article>`}
function memberRequests(){return `<h2 class="section-title">Permintaan akun</h2>${appData.requests.length?`<div class="card tablewrap"><table><tr><th>Nama</th><th>Jenis</th><th>Status</th><th>Tanggal</th></tr>${appData.requests.map(r=>`<tr><td>${esc(r.displayName)}</td><td>${esc(r.accountType)}</td><td>${status(r.status)}</td><td>${new Date(r.createdAt).toLocaleDateString('id-ID')}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada permintaan akun.</div>'}`}
function ownerRequests(){const list=appData.requests.filter(r=>r.status==='pending');return `<h2 class="section-title">Permintaan akun trading</h2>${list.length?list.map(r=>`<div class="card" style="margin-bottom:12px"><div class="row between"><b>${esc(r.displayName)}</b>${status(r.status)}</div><p class="muted">${esc(r.accountType)} · ${esc(r.userId)}</p><button class="btn green small" data-approve-account="${esc(r.requestId)}">Periksa & proses</button></div>`).join(''):'<div class="empty">Tidak ada permintaan akun yang menunggu.</div>'}`}
function memberDeposits(){return `<h2 class="section-title">Riwayat deposit</h2>${appData.deposits.length?`<div class="card tablewrap"><table><tr><th>Metode</th><th>Diminta</th><th>Status</th><th>Bukti</th></tr>${appData.deposits.map(d=>`<tr><td>${esc(d.method)}</td><td>${money(d.amountRequested)}</td><td>${status(d.status)}</td><td>${d.status==='awaiting_proof'?`<button class="btn green small" data-upload-proof="${esc(d.depositId)}">Kirim bukti</button>`:(d.evidenceUrl?'Terkirim':'—')}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada riwayat deposit. Mulai dari tombol Deposit pada akun.</div>'}`}
function ownerDeposits(){const list=appData.deposits.filter(d=>d.status==='pending');return `<h2 class="section-title">Konfirmasi deposit</h2>${list.length?list.map(d=>`<div class="card" style="margin-bottom:12px"><b>${esc(d.method)} · ${money(d.amountRequested)}</b><p class="muted">Member: ${esc(d.userId)}<br>Akun: ${esc(d.accountId)}</p>${d.evidenceUrl?`<p><a href="${esc(d.evidenceUrl)}" target="_blank" rel="noopener">Lihat bukti simulasi</a></p>`:'<p class="muted">Bukti belum tersedia.</p>'}<button class="btn green small" data-approve-deposit="${esc(d.depositId)}">Verifikasi & kreditkan simulasi</button></div>`).join(''):'<div class="empty">Tidak ada deposit yang menunggu.</div>'}`}
function memberWithdrawals(){return `<h2 class="section-title">Riwayat withdraw</h2>${appData.withdrawals.length?`<div class="card tablewrap"><table><tr><th>Akun</th><th>Nominal</th><th>Status</th></tr>${appData.withdrawals.map(w=>`<tr><td>${esc(w.accountId)}</td><td>${money(w.amount)}</td><td>${status(w.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada permintaan withdraw.</div>'}`}
function ownerWithdrawals(){const list=appData.withdrawals.filter(w=>w.status==='pending');return `<h2 class="section-title">Permintaan withdraw simulasi</h2>${list.length?list.map(w=>`<div class="card" style="margin-bottom:12px"><b>${money(w.amount)}</b><p class="muted">Member: ${esc(w.userId)}<br>Akun: ${esc(w.accountId)}</p><button class="btn green small" data-approve-withdraw="${esc(w.withdrawalId)}">Setujui</button> <button class="btn danger small" data-reject-withdraw="${esc(w.withdrawalId)}">Tolak</button></div>`).join(''):'<div class="empty">Tidak ada withdraw yang menunggu.</div>'}`}
function ownerMembers(){return `<h2 class="section-title">Daftar member</h2><div class="card tablewrap"><table><tr><th>Nama</th><th>Email</th><th>WhatsApp</th><th>Status</th><th>Aksi</th></tr>${appData.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${esc(m.phone)}</td><td>${status(m.status)}</td><td>${m.status==='deleted'?'—':`<button class="btn danger small" data-delete-member="${esc(m.userId)}">Hapus</button>`}</td></tr>`).join('')}</table></div>`}
function ownerAccounts(){const rows=appData.accounts;return `<h2 class="section-title">Daftar akun</h2>${rows.length?`<div class="card tablewrap"><table><tr><th>Login ID</th><th>Member ID</th><th>Nama akun</th><th>Status</th><th>Aksi</th></tr>${rows.map(a=>`<tr><td>${esc(a.loginId)}</td><td>${esc(a.userId||'')}</td><td>${esc(a.displayName)}</td><td>${status(a.status)}</td><td>${a.status==='deleted'?'—':`<button class="btn danger small" data-delete-account="${esc(a.accountId)}">Hapus</button>`}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada akun.</div>'}`}
function status(s){let cls=s==='approved'||s==='active'?'':'gray';if(s==='rejected')cls='red';return `<span class="pill ${cls}">${esc(s)}</span>`}
function modal(html){const b=document.createElement('div');b.className='modalback';b.innerHTML=`<div class="modal">${html}</div>`;b.onclick=e=>{if(e.target===b)b.remove()};document.body.appendChild(b);return b}
function openAccountModal(){const m=modal(`<h2>Buka akun trading</h2><p class="muted">Isi nama akun dan password trading awal. Owner akan memeriksa permintaan dan dapat menetapkan ulang password saat persetujuan.</p><form id="accountForm"><div class="field"><label>Nama akun</label><input name="displayName" required placeholder="Nama yang tampil"></div><div class="field"><label>Jenis akun</label><select name="accountType"><option>Standard</option><option>Cent</option></select></div><div class="field"><label>Password trading awal</label><input name="tradingPassword" type="password" minlength="8" required placeholder="Minimal 8 karakter"></div><button class="btn green" style="width:100%">Kirim persetujuan</button></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const r=await call('submitAccountRequest',token,Object.fromEntries(new FormData(e.target)));m.remove();toast(r.message);await loadData()}catch(err){showError(err)}}}
function showCredentials(id){const a=appData.accounts.find(x=>x.accountId===id);if(!a)return;modal(`<h2>Login akun trading</h2><div class="notice warn">Jaga kerahasiaan kredensial. Jangan bagikan kepada siapa pun.</div><div class="field"><label>Login ID</label><input readonly value="${esc(a.loginId)}"></div><div class="field"><label>Password</label><input readonly value="${esc(a.tradingPassword)}"></div><div class="field"><label>Server</label><input readonly value="${esc(a.server)}"></div><button class="btn green" style="width:100%" onclick="this.closest('.modalback').remove()">Tutup</button>`)}
function openDepositModal(accountId){const m=modal(`<h2>Deposit simulasi</h2><div class="field"><label>Metode pembayaran</label><select id="payMethod"><option>DANA</option><option>SeaBank</option></select></div><div class="field"><label>Nominal deposit (IDR)</label><input id="payAmount" type="number" min="10000" step="1000" placeholder="Contoh: 100000" required></div><p class="hint">Klik konfirmasi untuk menampilkan instruksi simulasi. Tidak ada pembayaran sungguhan yang diproses.</p><button class="btn green" id="sendDeposit" style="width:100%">Konfirmasi</button>`);m.querySelector('#sendDeposit').onclick=async()=>{try{const r=await call('submitDeposit',token,{accountId,method:m.querySelector('#payMethod').value,amount:m.querySelector('#payAmount').value});m.innerHTML=`<h2>Instruksi transfer simulasi</h2><div class="notice"><b>${esc(r.method)}</b><br>${esc(r.destination)}<br>Atas nama: <b>${esc(r.recipientName)}</b><br>Nominal: <b>${money(r.amount)}</b></div><p class="hint">Ini hanya simulasi. Jangan mengirim uang sungguhan. Setelah tahap simulasi, unggah gambar bukti untuk diperiksa owner.</p><button class="btn green" id="goProof" style="width:100%">Kirim Bukti Transfer</button><button class="btn light" id="closeDeposit" style="width:100%;margin-top:8px">Tutup</button>`;m.querySelector('#goProof').onclick=()=>{m.remove();openProofModal(r.depositId)};m.querySelector('#closeDeposit').onclick=()=>{m.remove();loadData()};}catch(e){showError(e)}}}
function openProofModal(depositId){const m=modal(`<h2>Kirim bukti transfer simulasi</h2><div class="field"><label>Pilih gambar bukti (JPG/PNG/WEBP, maks. 1,3 MB)</label><input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp" required></div><button class="btn green" id="uploadProof" style="width:100%">Upload bukti</button>`);m.querySelector('#uploadProof').onclick=async()=>{const f=m.querySelector('#proofFile').files[0];if(!f){toast('Pilih gambar terlebih dahulu');return}if(f.size>1300000){toast('Ukuran gambar maksimal 1,3 MB');return}try{const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(String(rd.result).split(',')[1]);rd.onerror=reject;rd.readAsDataURL(f)});const r=await call('uploadDepositProof',token,{depositId,fileName:f.name,mimeType:f.type,data});m.remove();toast(r.message);await loadData()}catch(e){showError(e)}}}
function openWithdrawalModal(accountId){const a=appData.accounts.find(x=>x.accountId===accountId);if(!a)return;if(a.currency!=='IDR'){toast('Withdraw simulasi hanya tersedia untuk akun IDR');return}const bal=Number(a.balance||0);const m=modal(`<h2>Withdraw simulasi</h2><p class="muted">Saldo tersedia: <b>${money(bal)}</b></p><div class="field"><label>Nominal penarikan (IDR)</label><input id="withdrawAmount" type="number" min="160000" max="${bal}" step="1000" placeholder="Minimal 160000" required></div><p class="hint">Minimal Rp160.000 dan maksimal sebesar saldo tersedia. Permintaan akan diperiksa owner; ini bukan pencairan uang sungguhan.</p><button class="btn green" id="sendWithdraw" style="width:100%">Ajukan withdraw</button>`);m.querySelector('#sendWithdraw').onclick=async()=>{try{const r=await call('submitWithdrawal',token,{accountId,amount:m.querySelector('#withdrawAmount').value});m.remove();toast(r.message);await loadData()}catch(e){showError(e)}}}

function bindOwnerActions(){
 document.querySelectorAll('[data-upload-proof]').forEach(b=>b.onclick=()=>openProofModal(b.dataset.uploadProof));
 document.querySelectorAll('[data-approve-withdraw]').forEach(b=>b.onclick=async()=>{try{const r=await call('ownerReviewWithdrawal',token,{withdrawalId:b.dataset.approveWithdraw,decision:'approve'});toast(r.message);await loadData()}catch(e){showError(e)}});
 document.querySelectorAll('[data-reject-withdraw]').forEach(b=>b.onclick=async()=>{try{const r=await call('ownerReviewWithdrawal',token,{withdrawalId:b.dataset.rejectWithdraw,decision:'reject'});toast(r.message);await loadData()}catch(e){showError(e)}});
 document.querySelectorAll('[data-approve-account]').forEach(b=>b.onclick=()=>{const id=b.dataset.approveAccount;const m=modal(`<h2>Persetujuan akun</h2><p class="muted">Masukkan kredensial trading final. Password trading awal member hanya diverifikasi saat pengajuan dan tidak dapat dibaca owner.</p><form id="reviewAcc"><div class="field"><label>Login ID</label><input name="loginId" required></div><div class="field"><label>Password trading final</label><input name="tradingPassword" type="password" minlength="8" required></div><div class="field"><label>Server</label><input name="server" required placeholder="Contoh: Versa-MT5Live"></div><div class="field"><label>Catatan (opsional)</label><input name="note"></div><button class="btn green" style="width:100%">Setujui akun</button></form><button class="btn danger" id="rejectAcc" style="width:100%;margin-top:9px">Tolak permintaan</button>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await call('ownerReviewAccount',token,{...Object.fromEntries(new FormData(e.target)),requestId:id,decision:'approve'});m.remove();toast('Akun disetujui');await loadData()}catch(err){showError(err)}};m.querySelector('#rejectAcc').onclick=async()=>{try{await call('ownerReviewAccount',token,{requestId:id,decision:'reject'});m.remove();await loadData()}catch(err){showError(err)}}});
 document.querySelectorAll('[data-approve-deposit]').forEach(b=>b.onclick=()=>{const id=b.dataset.approveDeposit;const m=modal(`<h2>Verifikasi deposit</h2><p class="muted">Pastikan dana benar-benar sudah diterima sebelum menyetujui.</p><div class="field"><label>Saldo yang dikreditkan</label><input id="creditAmount" type="number" min="0.01" step="any" placeholder="Contoh: 550 untuk 550 USC" required></div><div class="field"><label>Catatan (opsional)</label><input id="depositNote"></div><button class="btn green" id="confirmCredit" style="width:100%">Setujui & kreditkan saldo</button><button class="btn danger" id="rejectDep" style="width:100%;margin-top:9px">Tolak deposit</button>`);m.querySelector('#confirmCredit').onclick=async()=>{try{await call('ownerReviewDeposit',token,{depositId:id,decision:'approve',amountCredited:m.querySelector('#creditAmount').value,note:m.querySelector('#depositNote').value});m.remove();toast('Deposit disetujui');await loadData()}catch(err){showError(err)}};m.querySelector('#rejectDep').onclick=async()=>{try{await call('ownerReviewDeposit',token,{depositId:id,decision:'reject'});m.remove();await loadData()}catch(err){showError(err)}}});
 document.querySelectorAll('[data-delete-account]').forEach(b=>b.onclick=async()=>{if(!confirm('Nonaktifkan akun ini? Riwayat transaksi tetap disimpan.'))return;try{const r=await call('ownerDeleteAccount',token,{accountId:b.dataset.deleteAccount});toast(r.message);await loadData()}catch(err){showError(err)}});
 document.querySelectorAll('[data-delete-member]').forEach(b=>b.onclick=async()=>{if(!confirm('Nonaktifkan member ini? Member tidak bisa login lagi dan semua akunnya dinonaktifkan. Riwayat tetap disimpan.'))return;try{const r=await call('ownerDeleteMember',token,{userId:b.dataset.deleteMember});toast(r.message);await loadData()}catch(err){showError(err)}});
}
if(token)loadData();else renderAuth();
</script>
</body>
</html>
